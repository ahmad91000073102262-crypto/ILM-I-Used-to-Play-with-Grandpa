 if(a.x)o+=`<div class="card">${a.x}${a.tts?`<p><button class="bt sm" data-tts="${a.id}">🔊 ${t('tl')}</button></p>`:''}</div>`;
 ord(a.g.length,S.key+a.id).forEach(gi=>{const g=a.g[gi];
  if(g.x)o+=`<div class="card">${g.x}</div>`;
  o+='<div class="card">';
  ord(g.i.length,S.key+a.id+gi).forEach(ii=>{const it=g.i[ii],k=a.id+'.'+gi+'.'+ii;n++;
   if(a.type=='mcq'){
    o+=`<div class="it"><b>${n}. ${it.q}</b>`;
    ord(4,S.key+k).forEach((oi,p)=>{const ck=S.ans[k]==oi,cl=sb?(oi==it.a?' ok':ck?' no':''):'';
     o+=`<label class="op${cl}"><input type="radio" name="${k}" value="${oi}" data-k="${k}"${ck?' checked':''}${lk?' disabled':''}> ${'ABCD'[p]}. ${it.o[oi]}</label>`});
    o+='</div>'}
   else{let b=0;
    const html=it.q.replace(/\{\}/g,()=>{const kk=k+'.'+b,v=S.ans[kk]||'',ok=chk(it.a[b],v),c=sb?(ok?' ok':' no'):'';let s;
     if(a.type=='sel')s=`<select class="bl${c}" data-k="${kk}"${lk?' disabled':''}><option value="">${t('pick')}</option>`+ord(BANK.length,S.key+kk).map(i=>`<option${BANK[i]==v?' selected':''}>${BANK[i]}</option>`).join('')+'</select>';
     else s=`<input type="text" class="bl${c}" data-k="${kk}" value="${esc(v)}" autocomplete="off" autocapitalize="none" spellcheck="false"${lk?' disabled':''}>`;
     if(sb&&!ok)s+=`<small class="no">→ ${it.a[b].split('|')[0]}</small>`;
     b++;return s});
    o+=`<div class="it"><b>${n}.</b> ${html}</div>`}
  });
  o+='</div>'});
 if(!lk)o+=`<button class="bt" data-sub="${a.id}">${t('sub2')}</button>`;
 return o}
function certView(){
 const e=ACT.filter(a=>S.sc[a.id]>=80);if(!e.length)return `<h2>🏅 ${t('cert')}</h2><p class="card">${t('nc')}</p>`;
 const d=new Date().toLocaleDateString(P.lang=='id'?'id-ID':'en-GB',{day:'numeric',month:'long',year:'numeric'}),I=S.id;
 return `<h2>🏅 ${t('cert')}</h2>`+e.map(a=>`<div class="cert"><div style="font-size:34px">🏅</div><h3>${t('ct')}</h3><div>${t('cc')}</div><div class="nm">${esc(I.n)}</div><div>${t('cl')} ${esc(I.c)} · ${t('cn')} ${esc(I.p)} · ${esc(I.m)}</div><p>${t('cd')}<br><b>${a.n} — ${a.ti[P.lang]}</b><br>Chapter IV · I Used to Play with Grandpa</p><p>${t('cs')} <b style="font-size:26px">${S.sc[a.id]}</b>/100</p><div class="sg">${d}<br>${t('by')}<br><b>Ahmad Budi Leksono</b></div><button class="bt sm nop" data-pr>🖨 ${t('pr')}</button></div>`).join('')}
function render(){
 const R=document.documentElement;if(P.theme)R.dataset.theme=P.theme;else delete R.dataset.theme;R.lang=P.lang;
 $('#sub').textContent=t('sub');$('#by').innerHTML=t('by')+'<br><b>Ahmad Budi Leksono</b>';
 const it=[['dash','📊 '+t('dash')],['id','🪪 '+t('idm')],...ACT.map(a=>[a.id,'📝 '+a.n+(S&&S.sc[a.id]>=80?' 🏅':S&&S.sc[a.id]!==undefined?' ✔':'')]),['cert','🏅 '+t('cert')]];
 $('#nav').innerHTML=it.map(([k,l])=>`<button class="nv${view==k?' on':''}" data-go="${k}"${!S&&k!='id'?' disabled':''}>${l}</button>`).join('');
 const dk=(P.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark';
 $('#ctl').innerHTML=`<button class="nv" data-lang="${P.lang=='id'?'en':'id'}">🌐 ${t('lang')}</button><button class="nv" id="th">${dk?'☀️ '+t('light'):'🌙 '+t('dark')}</button>`;
 $('#who').textContent=S?S.id.n+' · '+S.id.c+' / '+S.id.p:'';
 $('#mt').textContent=t('tu');$('#mm').textContent=t('tum');$('#mo').textContent=t('ok');
 const V={id:idView,dash:dashView,cert:certView};
 $('#v').innerHTML=V[view]?V[view]():actView(ACT.find(a=>a.id==view));tk()}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let b;
 if(b=q('[data-go]'))go(b.dataset.go);
 else if(b=q('[data-sub]'))subm(b.dataset.sub);
 else if(b=q('[data-lang]')){P.lang=b.dataset.lang;sv();render()}
 else if(q('#th')){const dk=(P.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark';P.theme=dk?'light':'dark';sv();render()}
 else if(q('#sid'))saveId();
 else if(q('#mb'))$('.app').classList.toggle('open');
 else if(q('#mo')){$('#mod').hidden=true;go('dash')}
 else if(b=q('[data-tts]')){try{const a=ACT.find(x=>x.id==b.dataset.tts),u=new SpeechSynthesisUtterance(a.x.replace(/<[^>]+>/g,' '));u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(x){}}
 else if(q('[data-pr]')){const c=q('.cert');c.classList.add('sel');try{window.print()}catch(x){}c.classList.remove('sel')}
});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const el=e.target;
 if(el.id&&el.id.startsWith('f_'))D[el.id]=el.value;
 else if(el.dataset&&el.dataset.k&&S&&!S.done){S.ans[el.dataset.k]=el.value;sv()}}));
/* ---------- anti copy / paste ---------- */
['copy','cut','paste','contextmenu','dragstart','drop'].forEach(v=>document.addEventListener(v,e=>e.preventDefault()));
document.addEventListener('selectstart',e=>{if(!/^(INPUT|SELECT)$/.test(e.target.tagName||''))e.preventDefault()});
document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();
 if(((e.ctrlKey||e.metaKey)&&k.length==1&&'cvxaspu'.includes(k))||k=='f12'||k=='printscreen'){e.preventDefault();if(k=='printscreen')try{navigator.clipboard.writeText(' ')}catch(x){}}});
/* ---------- init ---------- */
ld();view=S?'dash':'id';render();setInterval(tk,250);
</script>
